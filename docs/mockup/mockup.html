<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Mockup seluler Sempat</title>
<style>
  @font-face { font-family: Plex; font-weight: 300; src: url('../../frontend/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: Plex; font-weight: 400; src: url('../../frontend/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: Plex; font-weight: 600; src: url('../../frontend/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
  :root { --ink: #161616; --muted: #525252; --blue: #1570cd; --orange: #f5a51b; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Plex, 'Helvetica Neue', Arial, sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; }

  .sheet { width: 1800px; padding: 64px 72px 56px; background: linear-gradient(180deg, #f2f6fb 0%, #ffffff 62%); }
  .head { display: flex; align-items: center; gap: 22px; margin-bottom: 52px; }
  .head img { width: 76px; height: 76px; }
  .head h1 { font-size: 44px; font-weight: 300; line-height: 1.1; letter-spacing: -0.3px; }
  .head h1 b { font-weight: 600; }
  .head p { font-size: 18px; color: var(--muted); margin-top: 6px; }

  .row { display: flex; justify-content: space-between; align-items: flex-start; }
  figure { width: 300px; display: flex; flex-direction: column; align-items: center; }
  .phone { position: relative; width: 300px; height: 630px; border-radius: 48px; background: #0e0e10; padding: 11px;
           box-shadow: 0 0 0 2px #2b2b2f inset, 0 30px 60px -24px rgba(16, 40, 80, .35), 0 12px 24px -12px rgba(0,0,0,.25); }
  .phone::before { /* tombol samping */ content: ''; position: absolute; right: -3px; top: 150px; width: 3px; height: 70px; background: #2b2b2f; border-radius: 0 2px 2px 0; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #fff; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .status { position: absolute; inset: 0 0 auto 0; height: 34px; background: #161616; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-size: 13px; font-weight: 600; z-index: 2; }
  .status .ic { display: flex; gap: 5px; align-items: center; }
  .status .bat { width: 22px; height: 11px; border: 1.5px solid #fff; border-radius: 3px; position: relative; }
  .status .bat::after { content: ''; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: #fff; border-radius: 1px; }
  .island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 14px; background: #000; z-index: 3; }
  .screen.with-status img { margin-top: 34px; height: calc(100% - 34px); }
  .light .status { background: #161616; }

  figcaption { margin-top: 30px; text-align: left; width: 100%; }
  .num { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #161616; font-weight: 600; font-size: 15px; margin-bottom: 12px; }
  figcaption h2 { font-size: 21px; font-weight: 600; line-height: 1.25; margin-bottom: 6px; }
  figcaption p { font-size: 15px; line-height: 1.45; color: var(--muted); }

  .foot { margin-top: 48px; padding-top: 18px; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }

  /* Mode satu ponsel: ?satu=nama */
  body.single { background: transparent; }
  body.single .sheet { width: auto; padding: 40px; background: transparent; }
  body.single .head, body.single .foot, body.single figcaption { display: none; }
  body.single figure:not(.on) { display: none; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <header class="head">
    <img src="../../frontend/public/brand/sempat-logo.png" alt="Logo Sempat" />
    <div>
      <h1><b>Sempat</b> — uji kecukupan tempat evakuasi sementara tsunami</h1>
      <p>Tampilan aplikasi web pada telepon seluler · Kota Bengkulu</p>
    </div>
  </header>

  <div class="row">
    <figure data-id="masuk">
      <div class="phone"><div class="island"></div><div class="screen with-status"><div class="status"><span>09.41</span><span class="ic">5G <span class="bat"></span></span></div><img src="screens/1-masuk.png" alt="" /></div></div>
      <figcaption><span class="num">1</span><h2>Masuk berbasis peran</h2><p>Admin, Analis, dan Peneliti masuk dengan akun; tamu cukup memakai tautan publik.</p></figcaption>
    </figure>

    <figure data-id="peta">
      <div class="phone"><div class="island"></div><div class="screen with-status"><div class="status"><span>09.41</span><span class="ic">5G <span class="bat"></span></span></div><img src="screens/2-peta-hasil.png" alt="" /></div></div>
      <figcaption><span class="num">2</span><h2>Peta kelas sisa waktu</h2><p>Setiap sel 100 m diberi kelas Cukup, Rawan, Terlambat, atau Terputus, lengkap dengan parameter skenario.</p></figcaption>
    </figure>

    <figure data-id="rute">
      <div class="phone"><div class="island"></div><div class="screen with-status"><div class="status"><span>09.41</span><span class="ic">5G <span class="bat"></span></span></div><img src="screens/3a-rute.png" alt="" /></div></div>
      <figcaption><span class="num">3</span><h2>Rute ke TES terdekat</h2><p>Ketuk sel untuk melihat jalur terpendek lewat jaringan jalan dan rincian <span style="white-space:nowrap">m = Tₐ − (τ + t)</span>.</p></figcaption>
    </figure>

    <figure data-id="prioritas">
      <div class="phone"><div class="island"></div><div class="screen with-status"><div class="status"><span>09.41</span><span class="ic">5G <span class="bat"></span></span></div><img src="screens/4-prioritas.png" alt="" /></div></div>
      <figcaption><span class="num">4</span><h2>Daftar prioritas intervensi</h2><p>Kelurahan diurutkan menurut penduduk Terlambat, dengan rekomendasi dan aturan yang memicunya.</p></figcaption>
    </figure>

    <figure data-id="publik">
      <div class="phone"><div class="island"></div><div class="screen with-status"><div class="status"><span>09.41</span><span class="ic">5G <span class="bat"></span></span></div><img src="screens/6-publik.png" alt="" /></div></div>
      <figcaption><span class="num">5</span><h2>Tampilan publik baca-saja</h2><p>Untuk relawan dan warga: peta dan indeks tanpa data akun; sel di bawah 10 jiwa disembunyikan.</p></figcaption>
    </figure>
  </div>

  <footer class="foot">
    <span>Tangkapan layar asli aplikasi Sempat v1.0 dengan data contoh sintetis.</span>
    <span>Hasil adalah uji kecukupan skenario, bukan prediksi tsunami.</span>
  </footer>
</div>
<script>
  const one = new URLSearchParams(location.search).get('satu')
  if (one) {
    document.body.classList.add('single')
    document.querySelector(`figure[data-id="${one}"]`)?.classList.add('on')
  }
</script>
</body>
</html>
